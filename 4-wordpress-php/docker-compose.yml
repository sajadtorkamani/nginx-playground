services:
    nginx:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8004:80"
        volumes:
            - .:/usr/share/nginx/html
            - ./nginx.conf:/etc/nginx/nginx.conf

    mysql:
        image: mysql:8.4
        restart: always
        environment:
            MYSQL_DATABASE: wordpress_php
            MYSQL_ROOT_PASSWORD: password
        ports:
            - "3306:3306"
        volumes:
            - wordpress-php:/var/lib/mysql

volumes:
    wordpress-php: